<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-placeholder">U</div>
            <h2>University Portal</h2>
        </div>
        <div id="headerAuthNav">
            <a href="login.html" class="btn">Login</a>
        </div>
    </header>

    <div class="container">
        <div class="card center-box">
            <h1>Online Examination & Evaluation System</h1>
            <p>Welcome to the university's official examination portal. Please log in or register to access the portal.</p>
            <div id="authActionArea">
                <a href="login.html" class="btn full-width">Login to Portal</a>
            </div>
            <p style="margin-top: 20px; font-size: 14px;">
                Don't have an account? <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Register here</a>
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
