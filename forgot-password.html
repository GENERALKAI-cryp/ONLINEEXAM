<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Online Examination System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-placeholder">U</div>
            <h2>University Portal</h2>
        </div>
        <a href="index.html" class="btn btn-secondary">Home</a>
    </header>

    <div class="container">
        <div class="card center-box">
            <h2>Recover Password</h2>
            <p>Enter your username or registered email address to receive password reset instructions.</p>
            
            <form action="javascript:void(0);" onsubmit="handleForgotPassword()">
                <div class="form-group">
                    <label for="recoveryInput">Username or Email</label>
                    <input type="text" id="recoveryInput" class="form-control" placeholder="Enter username or email" required>
                </div>

                <button type="submit" class="btn full-width">Send Reset Link</button>
            </form>

            <p style="margin-top: 20px; font-size: 14px;">
                Remembered your password? <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
