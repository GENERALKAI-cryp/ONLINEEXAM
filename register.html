<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Examination System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="app-styles.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-placeholder">U</div>
            <h2>University Portal</h2>
        </div>
        <a href="index.html" class="btn btn-secondary">Home</a>
    </header>

    <div class="container">
        <div class="card center-box">
            <h2>Create an Account</h2>
            <p>Register to access the examination portal.</p>
            
            <form action="javascript:void(0);" onsubmit="handleRegister()">
                <div class="form-group">
                    <label for="regUserType">Register As</label>
                    <select id="regUserType" class="form-control" required>
                        <option value="" disabled selected>Select user type</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn full-width">Register</button>
            </form>

            <p style="margin-top: 20px; font-size: 14px;">
                Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Login here</a>
            </p>
        </div>
    </div>

    <script src="exam-store.js"></script>
    <script src="app-utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
